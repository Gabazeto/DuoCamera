<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MultiCam Duo - Live Ome.tv</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      height: 100%;
      max-width: 540px;
      position: relative;
      background: #020617;
      display: flex;
      flex-direction: column;
    }

    #lobbyScreen {
      margin: auto 16px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    }

    .header-lobby {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; }
    .accent {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .preview-box {
      width: 100%;
      height: 180px;
      background: #090d16;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .preview-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus { border-color: #6366f1; }

    .btn-join {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    #callScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .stage-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }

    #masterBroadcastVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .live-badge {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .status-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #10b981;
    }

    .floating-bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px;
      border-radius: 20px;
      z-index: 40;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
    .ctrl-btn:active { transform: scale(0.95); }

    .ctrl-btn.off {
      background: rgba(239, 68, 68, 0.3);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .btn-leave {
      background: rgba(239, 68, 68, 0.4);
      border-color: rgba(239, 68, 68, 0.6);
    }
    .btn-leave:hover { background: #ef4444; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="lobbyScreen">
      <div class="header-lobby">
        <div class="logo">
          <span>🎥</span>
          <span>MultiCam <span class="accent">Duo</span></span>
        </div>
      </div>

      <div class="preview-box">
        <video id="lobbyVideo" autoplay playsinline muted></video>
      </div>

      <div class="form-group">
        <label for="roomInput">ID da Sala:</label>
        <input type="text" id="roomInput" placeholder="Ex: duo-abc123" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="nameInput">Seu Nome / Apelido:</label>
        <input type="text" id="nameInput" placeholder="Ex: Lucas" maxlength="20" required>
      </div>

      <button id="btnJoinRoom" class="btn-join">
        🚀 Entrar na Sala
      </button>
    </div>

    <div id="callScreen" class="hidden">
      <div class="stage-container">
        <!-- CENTRO: OME.TV | 4 PONTAS: AMIGOS DA SALA -->
        <video id="masterBroadcastVideo" autoplay playsinline></video>

        <div class="top-bar">
          <div class="live-badge">
            <span class="live-dot"></span>
            <span>OME.TV AO VIVO</span>
          </div>
          <div class="status-badge">
            🟢 Sala 4-Pontas Ativa
          </div>
        </div>
      </div>

      <div class="floating-bottom-bar">
        <button id="btnToggleMic" class="ctrl-btn" title="Mutar/Desmutar Microfone">
          🎤
        </button>

        <button id="btnToggleCam" class="ctrl-btn" title="Ligar/Desligar Câmera">
          📹
        </button>

        <button id="btnFlipCam" class="ctrl-btn" title="Virar Câmera (Frente/Trás)">
          🔄
        </button>

        <button id="btnLeaveRoom" class="ctrl-btn btn-leave" title="Sair da Chamada">
          🚪
        </button>
      </div>
    </div>
  </div>

  <script>
    const lobbyScreen = document.getElementById('lobbyScreen');
    const callScreen = document.getElementById('callScreen');
    const lobbyVideo = document.getElementById('lobbyVideo');
    const masterBroadcastVideo = document.getElementById('masterBroadcastVideo');
    const roomInput = document.getElementById('roomInput');
    const nameInput = document.getElementById('nameInput');
    const btnJoinRoom = document.getElementById('btnJoinRoom');
    const btnToggleMic = document.getElementById('btnToggleMic');
    const btnToggleCam = document.getElementById('btnToggleCam');
    const btnFlipCam = document.getElementById('btnFlipCam');
    const btnLeaveRoom = document.getElementById('btnLeaveRoom');

    let localStream = null;
    let peer = null;
    let currentCall = null;
    let currentFacingMode = 'user';
    let isMicMuted = false;
    let isCamOff = false;

    function initUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const room = params.get('room') || params.get('id');
      if (room) {
        roomInput.value = room;
        roomInput.readOnly = true;
      }
      const savedName = localStorage.getItem('multicam_guest_name');
      if (savedName) nameInput.value = savedName;
    }

    async function startCamera(facingMode = 'user') {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        localStream = stream;
        lobbyVideo.srcObject = stream;
        currentFacingMode = facingMode;

        localStream.getAudioTracks().forEach(t => (t.enabled = !isMicMuted));
        localStream.getVideoTracks().forEach(t => (t.enabled = !isCamOff));
        return stream;
      } catch (err) {
        console.error('Falha câmera:', err);
        throw err;
      }
    }

    async function joinRoom() {
      const roomId = roomInput.value.trim();
      const guestName = nameInput.value.trim() || 'Convidado';

      if (!roomId) {
        alert('Informe o ID da sala!');
        return;
      }

      localStorage.setItem('multicam_guest_name', guestName);
      btnJoinRoom.disabled = true;
      btnJoinRoom.textContent = 'Conectando à Sala...';

      try {
        if (!localStream) {
          await startCamera(currentFacingMode);
        }

        const guestPeerId = 'guest-' + Math.random().toString(36).substring(2, 9);
        peer = new Peer(guestPeerId, {
          debug: 1,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun2.l.google.com:19302' },
              { urls: 'stun:stun.cloudflare.com:3478' }
            ]
          }
        });

        peer.on('open', (id) => {
          console.log('Conectado com Peer ID:', id);

          const conn = peer.connect(roomId);
          conn.on('open', () => {
            conn.send({ type: 'GUEST_JOIN', name: guestName });
          });

          // Chamada direta com o Host
          const call = peer.call(roomId, localStream);
          currentCall = call;

          // Recebe o Master Broadcast (Centro Ome.tv + 4 Pontas Amigos)
          call.on('stream', (stream) => {
            console.log('Master Broadcast recebido com sucesso!', stream);
            masterBroadcastVideo.srcObject = stream;
            masterBroadcastVideo.play().catch(() => {});
            lobbyScreen.classList.add('hidden');
            callScreen.classList.remove('hidden');
          });

          call.on('close', () => {
            alert('A chamada foi encerrada.');
            leaveRoom();
          });

          call.on('error', (err) => {
            console.error('Erro chamada:', err);
            btnJoinRoom.disabled = false;
            btnJoinRoom.textContent = '🚀 Entrar na Sala';
          });
        });

        peer.on('error', (err) => {
          console.error('Erro PeerJS:', err);
          btnJoinRoom.disabled = false;
          btnJoinRoom.textContent = '🚀 Entrar na Sala';
        });

      } catch (err) {
        console.error('Erro geral:', err);
        btnJoinRoom.disabled = false;
        btnJoinRoom.textContent = '🚀 Entrar na Sala';
      }
    }

    btnToggleMic.addEventListener('click', () => {
      if (!localStream) return;
      isMicMuted = !isMicMuted;
      localStream.getAudioTracks().forEach(t => (t.enabled = !isMicMuted));
      btnToggleMic.classList.toggle('off', isMicMuted);
    });

    btnToggleCam.addEventListener('click', () => {
      if (!localStream) return;
      isCamOff = !isCamOff;
      localStream.getVideoTracks().forEach(t => (t.enabled = !isCamOff));
      btnToggleCam.classList.toggle('off', isCamOff);
    });

    btnFlipCam.addEventListener('click', async () => {
      const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
      try {
        await startCamera(nextMode);
        if (currentCall && currentCall.peerConnection) {
          const senders = currentCall.peerConnection.getSenders();
          const videoSender = senders.find(s => s.track && s.track.kind === 'video');
          const newVideoTrack = localStream.getVideoTracks()[0];
          if (videoSender && newVideoTrack) {
            videoSender.replaceTrack(newVideoTrack);
          }
        }
      } catch (e) {
        console.warn('Não foi possível alternar câmera:', e);
      }
    });

    function leaveRoom() {
      if (currentCall) { try { currentCall.close(); } catch (e) {} }
      if (peer) { try { peer.destroy(); } catch (e) {} }
      callScreen.classList.add('hidden');
      lobbyScreen.classList.remove('hidden');
      btnJoinRoom.disabled = false;
      btnJoinRoom.textContent = '🚀 Entrar na Sala';
    }

    btnLeaveRoom.addEventListener('click', leaveRoom);
    btnJoinRoom.addEventListener('click', joinRoom);

    window.addEventListener('DOMContentLoaded', () => {
      initUrlParams();
      startCamera('user').catch(() => {});
    });
  </script>
</body>
</html>
