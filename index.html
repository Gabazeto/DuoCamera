<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MultiCam Duo - Live Ome.tv</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .app-container {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo .icon { font-size: 24px; }
    .logo h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.5px; }
    .accent {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .status-connected .status-dot { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-connecting .status-dot { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
    .status-disconnected .status-dot { background: #ef4444; }
    
    .lobby-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 16px; line-height: 1.4; }
    .preview-box {
      width: 100%;
      height: 200px;
      background: #090d16;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .preview-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-large { width: 100%; padding: 14px; }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:hover { filter: brightness(1.1); }

    .call-container { display: flex; flex-direction: column; gap: 14px; }
    
    .main-video-wrapper {
      position: relative;
      width: 100%;
      height: 280px;
      border-radius: 16px;
      overflow: hidden;
      background: #020617;
      border: 2px solid rgba(99, 102, 241, 0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .main-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .live-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.5px;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .self-video-wrapper {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 100px;
      height: 130px;
      border-radius: 10px;
      overflow: hidden;
      background: #090d16;
      border: 2px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .self-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      width: 68px;
      height: 60px;
      color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tool-btn .icon { font-size: 18px; }
    .tool-btn .label { font-size: 11px; font-weight: 500; }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .tool-btn.active-off { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5; }
    .btn-danger { background: rgba(239, 68, 68, 0.25); border-color: rgba(239, 68, 68, 0.4); }
    .btn-danger:hover { background: #ef4444; color: #ffffff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <span class="icon">🎥</span>
        <h2>MultiCam <span class="accent">Duo</span></h2>
      </div>
      <div id="connectionStatus" class="status-pill status-disconnected">
        <span class="status-dot"></span>
        <span id="statusText">Desconectado</span>
      </div>
    </header>

    <div id="lobbyScreen" class="card lobby-card">
      <h3>Entrar na Transmissão</h3>
      <p class="subtitle">Você verá a pessoa do Ome.tv ao vivo e sua câmera será transmitida junto com o Host!</p>

      <div class="preview-box">
        <video id="lobbyVideo" autoplay playsinline muted></video>
      </div>

      <div class="form-group">
        <label for="roomInput">ID da Sala:</label>
        <input type="text" id="roomInput" placeholder="Ex: duo-abc123" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="nameInput">Seu Nome / Apelido:</label>
        <input type="text" id="nameInput" placeholder="Ex: Lucas" maxlength="20" required>
      </div>

      <div class="form-actions">
        <button id="btnJoinRoom" class="btn btn-primary btn-large">
          <span>🚀 Entrar na Sala</span>
        </button>
      </div>
    </div>

    <div id="callScreen" class="call-container hidden">
      <div class="main-video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="live-tag">
          <span class="live-dot"></span>
          <span>PESSOA DO OME.TV</span>
        </div>

        <div class="self-video-wrapper">
          <video id="localVideo" autoplay playsinline muted></video>
        </div>
      </div>

      <div class="toolbar">
        <button id="btnToggleMic" class="tool-btn" title="Mutar Microfone">
          <span class="icon">🎤</span>
          <span class="label">Mudo</span>
        </button>

        <button id="btnToggleCam" class="tool-btn" title="Desligar Câmera">
          <span class="icon">📹</span>
          <span class="label">Vídeo</span>
        </button>

        <button id="btnFlipCam" class="tool-btn" title="Trocar Câmera (Mobile)">
          <span class="icon">🔄</span>
          <span class="label">Virar</span>
        </button>

        <button id="btnLeaveRoom" class="tool-btn btn-danger" title="Sair da Sala">
          <span class="icon">🚪</span>
          <span class="label">Sair</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const lobbyScreen = document.getElementById('lobbyScreen');
    const callScreen = document.getElementById('callScreen');
    const lobbyVideo = document.getElementById('lobbyVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const localVideo = document.getElementById('localVideo');
    const roomInput = document.getElementById('roomInput');
    const nameInput = document.getElementById('nameInput');
    const btnJoinRoom = document.getElementById('btnJoinRoom');
    const btnToggleMic = document.getElementById('btnToggleMic');
    const btnToggleCam = document.getElementById('btnToggleCam');
    const btnFlipCam = document.getElementById('btnFlipCam');
    const btnLeaveRoom = document.getElementById('btnLeaveRoom');
    const connectionStatus = document.getElementById('connectionStatus');
    const statusText = document.getElementById('statusText');

    let localStream = null;
    let peer = null;
    let currentCall = null;
    let currentFacingMode = 'user';
    let isMicMuted = false;
    let isCamOff = false;

    function initUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const room = params.get('room') || params.get('id');
      if (room) {
        roomInput.value = room;
        roomInput.readOnly = true;
      }
      const savedName = localStorage.getItem('multicam_guest_name');
      if (savedName) nameInput.value = savedName;
    }

    function setStatus(status, text) {
      connectionStatus.className = 'status-pill status-' + status;
      statusText.textContent = text;
    }

    async function startCamera(facingMode = 'user') {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        localStream = stream;
        lobbyVideo.srcObject = stream;
        localVideo.srcObject = stream;
        currentFacingMode = facingMode;

        localStream.getAudioTracks().forEach(t => (t.enabled = !isMicMuted));
        localStream.getVideoTracks().forEach(t => (t.enabled = !isCamOff));
        return stream;
      } catch (err) {
        console.error('Falha câmera:', err);
        throw err;
      }
    }

    async function joinRoom() {
      const roomId = roomInput.value.trim();
      const guestName = nameInput.value.trim() || 'Convidado';

      if (!roomId) {
        alert('Informe o ID da sala!');
        return;
      }

      localStorage.setItem('multicam_guest_name', guestName);
      btnJoinRoom.disabled = true;
      setStatus('connecting', 'Conectando ao Host...');

      try {
        if (!localStream) {
          await startCamera(currentFacingMode);
        }

        const guestPeerId = 'guest-' + Math.random().toString(36).substring(2, 9);
        peer = new Peer(guestPeerId, {
          debug: 1,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', (id) => {
          console.log('Conectado com Peer ID:', id);

          const conn = peer.connect(roomId);
          conn.on('open', () => {
            conn.send({ type: 'GUEST_JOIN', name: guestName });
          });

          const call = peer.call(roomId, localStream);
          currentCall = call;

          call.on('stream', (omeRemoteStream) => {
            console.log('Stream da pessoa do Ome.tv recebido!', omeRemoteStream);
            remoteVideo.srcObject = omeRemoteStream;
            remoteVideo.play().catch(() => {});
            setStatus('connected', 'Conectado ao Ome.tv');
            lobbyScreen.classList.add('hidden');
            callScreen.classList.remove('hidden');
          });

          call.on('close', () => {
            alert('A chamada foi encerrada pelo Host.');
            leaveRoom();
          });

          call.on('error', (err) => {
            console.error('Erro na chamada:', err);
            setStatus('disconnected', 'Erro na conexão');
            btnJoinRoom.disabled = false;
          });
        });

        peer.on('error', (err) => {
          console.error('Erro PeerJS:', err);
          setStatus('disconnected', 'Erro servidor');
          btnJoinRoom.disabled = false;
        });

      } catch (err) {
        console.error('Erro geral:', err);
        btnJoinRoom.disabled = false;
        setStatus('disconnected', 'Erro');
      }
    }

    btnToggleMic.addEventListener('click', () => {
      if (!localStream) return;
      isMicMuted = !isMicMuted;
      localStream.getAudioTracks().forEach(t => (t.enabled = !isMicMuted));
      btnToggleMic.classList.toggle('active-off', isMicMuted);
      btnToggleMic.querySelector('.label').textContent = isMicMuted ? 'Mutado' : 'Mudo';
    });

    btnToggleCam.addEventListener('click', () => {
      if (!localStream) return;
      isCamOff = !isCamOff;
      localStream.getVideoTracks().forEach(t => (t.enabled = !isCamOff));
      btnToggleCam.classList.toggle('active-off', isCamOff);
      btnToggleCam.querySelector('.label').textContent = isCamOff ? 'Câm Off' : 'Vídeo';
    });

    btnFlipCam.addEventListener('click', async () => {
      const nextMode = currentFacingMode === 'user' ? 'environment' : 'user';
      try {
        await startCamera(nextMode);
        if (currentCall && currentCall.peerConnection) {
          const senders = currentCall.peerConnection.getSenders();
          const videoSender = senders.find(s => s.track && s.track.kind === 'video');
          const newVideoTrack = localStream.getVideoTracks()[0];
          if (videoSender && newVideoTrack) {
            videoSender.replaceTrack(newVideoTrack);
          }
        }
      } catch (e) {
        console.warn('Não foi possível alternar câmera:', e);
      }
    });

    function leaveRoom() {
      if (currentCall) { try { currentCall.close(); } catch (e) {} }
      if (peer) { try { peer.destroy(); } catch (e) {} }
      setStatus('disconnected', 'Desconectado');
      callScreen.classList.add('hidden');
      lobbyScreen.classList.remove('hidden');
      btnJoinRoom.disabled = false;
    }

    btnLeaveRoom.addEventListener('click', leaveRoom);
    btnJoinRoom.addEventListener('click', joinRoom);

    window.addEventListener('DOMContentLoaded', () => {
      initUrlParams();
      startCamera('user').catch(() => {});
    });
  </script>
</body>
</html>
